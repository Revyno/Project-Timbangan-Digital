# =============================================================================
# Timbangan Digital — Stack Produksi (VPS Ubuntu)
#
#   app       : PHP-FPM (Laravel) + menjalankan migrasi & cache saat start
#   nginx     : Web server (port 80) — serve /public, proxy PHP & WebSocket
#   mysql     : Database (tidak di-expose ke host — hanya jaringan internal)
#   reverb    : WebSocket server (Laravel Reverb) untuk data real-time
#   queue     : Queue worker (jobs: broadcast, dsb.)
#   scheduler : Penjadwal (php artisan schedule:work)
#
# Semua nilai ${...} dibaca dari file .env di direktori ini.
# =============================================================================

# Konfigurasi build dipakai bersama oleh service app & nginx (DRY).
x-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    VITE_APP_NAME: ${APP_NAME:-Timbangan-Digital}
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

services:

  app:
    build:
      <<: *app-build
      target: app
    image: timbangan-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      # Seeding otomatis saat start. Default "auto" = seed hanya bila DB kosong
      # (fresh install) sehingga restart/redeploy TIDAK menghapus data.
      # Nilai lain: "always" (paksa seed tiap start, mereset data) / "never".
      DB_SEED: ${DB_SEED:-auto}
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - timbangan

  nginx:
    build:
      <<: *app-build
      target: nginx
    image: timbangan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # aktifkan bila memakai TLS di dalam container (lihat README)
    depends_on:
      - app
      - reverb
    networks:
      - timbangan

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-timbangan}
      MYSQL_USER: ${DB_USERNAME:-timbangan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - mysql_data:/var/lib/mysql
      # Script init (mis. user monitoring) — HANYA jalan saat DB fresh/kosong.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # Port DB TIDAK di-expose ke host demi keamanan. Aktifkan hanya bila
    # perlu akses dari luar (mis. dump), lalu tutup lagi.
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-change_this_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - timbangan

  reverb:
    image: timbangan-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - app
    networks:
      - timbangan

  queue:
    image: timbangan-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600 --timeout=90
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      - app
    networks:
      - timbangan

  scheduler:
    image: timbangan-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
    command: php artisan schedule:work
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      - app
    networks:
      - timbangan

  # Test runner — hanya berjalan bila diminta (profile "test"), tidak ikut
  # `docker compose up`. Memakai DB sqlite :memory (phpunit.xml), tanpa MySQL.
  #   docker compose --profile test build test
  #   docker compose --profile test run --rm test
  test:
    build:
      <<: *app-build
      target: test
    image: timbangan-test
    profiles: ["test"]
    networks:
      - timbangan

  # ===========================================================================
  # MONITORING STACK — Prometheus + Grafana + exporters.
  # Tidak ikut `docker compose up` biasa. Jalankan bersama stack utama dengan:
  #     docker compose --profile monitoring up -d
  # Akses:  Grafana http://<host>:3000   |   Prometheus http://<host>:9090
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # hanya localhost; akses via SSH tunnel bila perlu
    networks:
      - timbangan

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - timbangan

  # Metrik HOST: CPU, RAM, disk, network VPS.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - timbangan

  # Metrik per-CONTAINER: CPU/RAM/IO tiap service (app, mysql, reverb, dll.).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    profiles: ["monitoring"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - timbangan

  # Metrik DATABASE MySQL. Butuh user 'exporter' (lihat docker/mysql/init).
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${DB_MONITOR_USER:-exporter}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_MONITOR_PASSWORD:-exporter_password}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - timbangan

volumes:
  mysql_data:
  storage_data:
  prometheus_data:
  grafana_data:

networks:
  timbangan:
    driver: bridge
