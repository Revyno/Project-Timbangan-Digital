version: '3.8'

services:

 mysql:
    image: mysql:9.1
    container_name: timbangan-digital
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timbangan
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 500M

volumes:
  mysql_data:
