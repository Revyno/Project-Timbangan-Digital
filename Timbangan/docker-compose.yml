version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: timbangan-app
    container_name: timbangan_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - timbangan-network

  nginx:
    image: nginx:Inertia
    container_name: timbangan_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - timbangan-network

networks:
  timbangan-network:
    driver: bridge
