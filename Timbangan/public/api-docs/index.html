<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scale IoT API Docs — PT Ladang Lima</title>
  <meta name="description" content="REST API Documentation untuk sistem Timbangan Digital IoT berbasis ESP8266 + Laravel Reverb" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }
    .topbar {
      background: linear-gradient(135deg, #16213e 0%, #0f3460 50%, #533483 100%);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .topbar .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e0e0e0;
      letter-spacing: 1px;
    }
    .topbar .badge {
      background: #e94560;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .topbar .sub {
      font-size: 0.8rem;
      color: #a0a0c0;
      margin-left: auto;
    }
    #swagger-ui .swagger-ui {
      font-family: 'Segoe UI', sans-serif;
    }
    /* Override Swagger header karena kita pakai custom topbar */
    .swagger-ui .topbar { display: none !important; }
    .swagger-ui .info { padding: 20px 0; }
    .swagger-ui .info .title { color: #1a1a2e !important; }
    .swagger-ui .scheme-container {
      background: #f4f4ff;
      padding: 12px 24px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">⚖️ Scale IoT API</div>
    <span class="badge">v1.0</span>
    <span class="sub">PT Ladang Lima Surabaya — ESP8266 + Laravel Reverb</span>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: "/docs/api-docs.json",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        requestSnippetsEnabled: true,
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
      });
    };
  </script>
</body>
</html>
