# Muat semua dashboard JSON dari folder /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: Timbangan
    orgId: 1
    folder: Timbangan Digital
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
