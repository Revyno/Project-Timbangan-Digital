; Konfigurasi PHP untuk lingkungan produksi Timbangan Digital.
; Di-load sebagai /usr/local/etc/php/conf.d/zz-app.ini (menimpa default).

; --- Upload & request body (import Excel / foto driver) ---
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120

; --- Timezone ---
date.timezone = Asia/Jakarta

; --- Error handling (jangan tampilkan error ke user di produksi) ---
display_errors = Off
log_errors = On

; --- OPcache (performa) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; Catatan: validate_timestamps=0 berarti OPcache tidak mengecek perubahan file.
; Setelah deploy kode baru, container app WAJIB di-restart / rebuild.
