# =============================================================================
# Nginx — Timbangan Digital (produksi)
#
#   - Menyajikan asset statis dari /var/www/public
#   - Mem-proxy request PHP ke container app (php-fpm) :9000
#   - Mem-proxy koneksi WebSocket Reverb (/app) ke container reverb :8080
# =============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # Kompresi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml
               font/woff2 application/font-woff;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ---- WebSocket Reverb ----------------------------------------------------
    # Browser terhubung ke wss://<host>/app/{key}. Nginx meneruskannya ke
    # container reverb. Jalur ini TIDAK bentrok dengan route aplikasi.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Aplikasi Laravel ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache asset statis hasil build Vite (nama file di-hash, aman di-cache lama)
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    # Blokir akses ke berkas tersembunyi (.env, .git, dll.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
