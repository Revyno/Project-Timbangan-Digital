# =============================================================================
# Prometheus — konfigurasi scrape untuk stack Timbangan Digital
#
#   prometheus       : metrik internal Prometheus sendiri
#   node-exporter    : CPU / RAM / disk / network HOST (VPS)
#   cadvisor         : metrik per-container (app, mysql, reverb, queue, dll.)
#   mysqld-exporter  : metrik database MySQL (koneksi, query, buffer pool, dsb.)
#
# Semua target berada di jaringan Docker internal `timbangan`, jadi cukup
# memakai nama service sebagai host.
# =============================================================================

global:
  scrape_interval: 15s       # seberapa sering metrik diambil
  evaluation_interval: 15s   # seberapa sering rule alert dievaluasi
  external_labels:
    monitor: timbangan-digital

# Rule alert (opsional). Isi file di docker/prometheus/rules/ bila diperlukan.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
